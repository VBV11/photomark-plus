# Publishes a GitHub release when a version tag (for example 2.0.0, without a v) is pushed.
# The three plugin files get a build provenance attestation, so anyone can check that a
# release file was made by this workflow from this repository:
#   gh attestation verify main.js -R VBV11/photomark-plus
name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write      # create the release
  id-token: write      # sign the attestation
  attestations: write  # store the attestation

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install (lockfile only, no install scripts)
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Tag matches manifest.json, package.json and versions.json
        run: |
          tag="${GITHUB_REF_NAME}"
          test "$(node -p "require('./manifest.json').version")" = "$tag"
          test "$(node -p "require('./package.json').version")" = "$tag"
          test "$(node -p "require('./versions.json')['$tag'] || ''")" != ""

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Release notes from CHANGELOG.md (empty when there is no section for this version)
        run: awk -v v="$GITHUB_REF_NAME" '$0 == "## " v {f = 1; next} /^## / && f {exit} f' CHANGELOG.md > notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css --title "$GITHUB_REF_NAME" --notes-file notes.md
